<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projets de Paul Tardieu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root { --bg: #0f1418; --panel: #171e24; --line: #2a343d; --ink: #e7edf1; --muted: #8d9aa5; --accent: #c8f05a; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; padding: 32px 16px 48px; }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: "Barlow Condensed", sans-serif; font-size: clamp(34px, 7vw, 52px); margin: 0; }
p { color: var(--muted); margin: 0; line-height: 1.5; }
a { color: var(--accent); }
.card { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; color: var(--ink); text-decoration: none; }
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card strong { font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1>Projets</h1>
  <p>Pages de projets en cours, à côté du <a href="https://portfolio.tardieu.ovh/">portfolio</a>.</p>
  <a class="card" href="rocket-league/">
    <strong>Bot Rocket League</strong>
    <p>Un bot qui apprend Rocket League par renforcement : courbes d'apprentissage et replay, en direct pendant l'entraînement.</p>
  </a>
</main>
</body>
</html>
